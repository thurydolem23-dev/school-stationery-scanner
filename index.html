
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Stationery Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: auto;
      padding: 18px;
      background: #f5f7fa;
    }

    h2 { text-align: center; }

    #reader {
      width: 100%;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    button, input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      font-size: 16px;
    }

    button {
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    #stop { background: #666; }

    #result {
      background: white;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #status {
      text-align: center;
      color: #444;
    }
  </style>
</head>

<body>
  <h2>School Stationery Scanner</h2>

  <button id="start">Start Barcode Scanner</button>
  <button id="stop">Stop Scanner</button>

  <div id="reader"></div>

  <p id="status">Scanner not started.</p>

  <div id="result">
    <strong>Scanned Barcode:</strong>
    <p id="barcode">No barcode scanned yet.</p>
  </div>

  <label for="manual">Manual Barcode Entry</label>
  <input id="manual" type="text"
         placeholder="Enter barcode manually">

  <button id="useManual">Use Manual Barcode</button>

  <script>
    let scanner = null;
    let running = false;

    const statusEl = document.getElementById("status");
    const barcodeEl = document.getElementById("barcode");

    function showBarcode(value) {
      const code = String(value || "").trim();
      if (!code) return;

      barcodeEl.textContent = code;
      document.getElementById("manual").value = code;
      statusEl.textContent = "Barcode detected successfully.";

      if (navigator.vibrate) navigator.vibrate(150);

      stopScanner();
    }

    async function startScanner() {
      if (running) return;

      try {
        if (!window.Html5Qrcode) {
          throw new Error("Scanner library failed to load.");
        }

        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 150 },
            aspectRatio: 1.777778
          },
          showBarcode,
          () => {}
        );

        running = true;
        statusEl.textContent = "Point camera at a barcode.";

      } catch (error) {
        running = false;
        scanner = null;
        statusEl.textContent =
          "Scanner error: " + (error.message || String(error));
      }
    }

    async function stopScanner() {
      if (!scanner) return;

      const current = scanner;
      scanner = null;

      try {
        await current.stop();
      } catch (error) {
        console.log(error);
      }

      try {
        current.clear();
      } catch (error) {
        console.log(error);
      }

      running = false;
    }

    document.getElementById("start").onclick = startScanner;
    document.getElementById("stop").onclick = stopScanner;

    document.getElementById("useManual").onclick = () => {
      showBarcode(document.getElementById("manual").value);
    };
  </script>
</body>
</html>
